<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HuB — the work board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDEFF2; --panel: #FFFFFF; --line: #C7CDD6; --line-strong: #9AA4B2;
    --ink: #1B2430; --ink-dim: #5B6472;
    --blue: #2C5F8A; --teal: #2F8F80; --amber: #C08A2E; --rose: #B23A48;
    --radius: 3px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151A; --panel: #1A1E25; --line: #2A2F38; --line-strong: #3B424E;
      --ink: #E6E9ED; --ink-dim: #8A93A1;
      --blue: #6FB4DE; --teal: #4FD1C5; --amber: #E8A33D; --rose: #E06B76;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151A; --panel: #1A1E25; --line: #2A2F38; --line-strong: #3B424E;
    --ink: #E6E9ED; --ink-dim: #8A93A1;
    --blue: #6FB4DE; --teal: #4FD1C5; --amber: #E8A33D; --rose: #E06B76;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: 'Space Grotesk', sans-serif; -webkit-font-smoothing: antialiased; }
  body {
    background-image: linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px; background-attachment: fixed;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 10px; border-bottom: 2px solid var(--ink);
    padding-bottom: 14px; margin-bottom: 22px; }
  header.top h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; font-weight: 700; }
  header.top .sub { font-family: 'IBM Plex Mono', monospace; color: var(--ink-dim); font-size: 0.8rem; }
  .btns { display: flex; gap: 8px; }
  .btn { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem;
    background: none; border: 1px solid var(--line-strong); color: var(--ink-dim);
    padding: 5px 10px; border-radius: var(--radius); cursor: pointer; }
  .btn:hover { color: var(--ink); border-color: var(--ink-dim); }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  nav.tabs { display: flex; gap: 2px; margin-bottom: 20px; flex-wrap: wrap; }
  nav.tabs button { font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem;
    background: var(--panel); color: var(--ink-dim); border: 1px solid var(--line-strong);
    border-bottom: none; padding: 9px 16px; cursor: pointer; position: relative; top: 1px; }
  nav.tabs button.active { color: var(--ink); border-bottom: 1px solid var(--panel); font-weight: 600; }
  nav.tabs button .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-right: 6px; background: var(--line-strong); }
  nav.tabs button .dot.ok { background: var(--teal); }
  nav.tabs button .dot.warn { background: var(--amber); }
  nav.tabs button .dot.err { background: var(--rose); }
  nav.tabs button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .panel-line { border-top: 1px solid var(--line-strong); margin-bottom: 26px; }

  .card { background: var(--panel); border: 1px solid var(--line-strong);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 22px; }
  .card h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-dim); margin: 0 0 16px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .card h2 .q { color: var(--ink); text-transform: none; letter-spacing: 0; }

  /* Header strip: "is the machine running?" */
  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .stat { border: 1px solid var(--line-strong); border-radius: var(--radius);
    padding: 12px 12px 10px; position: relative; }
  .stat::before, .stat::after { content: ''; position: absolute; width: 6px; height: 6px;
    border-color: var(--line-strong); border-style: solid; }
  .stat::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
  .stat::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
  .stat .num { font-family: 'IBM Plex Mono', monospace; font-size: 1.5rem; font-weight: 600; line-height: 1; }
  .stat .num.warn { color: var(--amber); }
  .stat .num.crit { color: var(--rose); }
  .stat .num a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
  .stat .num a:hover { border-bottom-style: solid; }
  .stat .lbl a { color: var(--blue); text-decoration: none; }
  .stat .lbl a:hover { text-decoration: underline; }
  .stat .lbl { font-size: 0.68rem; color: var(--ink-dim); margin-top: 6px; font-family: 'IBM Plex Mono', monospace; }
  .stat .lbl .mini { display: block; margin-top: 3px; color: var(--ink-dim); }

  .chart { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
  .legend .item { display: flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--ink-dim); }
  .legend .swatch { width: 10px; height: 10px; border-radius: 2px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  th { text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 0.66rem;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-dim);
    font-weight: 600; border-bottom: 1px solid var(--line-strong); padding: 6px 8px; }
  td { padding: 6px 8px; border-bottom: 1px dashed var(--line); font-family: 'IBM Plex Mono', monospace; }
  tr:last-child td { border-bottom: none; }
  td a { color: var(--blue); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  tr.rowlink { cursor: pointer; }
  tr.rowlink:hover td { background: var(--bg); }
  .tablewrap { overflow-x: auto; }
  .pill { display: inline-block; font-size: 0.66rem; padding: 1px 6px; border-radius: 8px;
    border: 1px solid var(--line-strong); color: var(--ink-dim); }
  .pill.done { border-color: var(--teal); color: var(--teal); }
  .pill.open { border-color: var(--amber); color: var(--amber); }

  .log { font-family: 'IBM Plex Mono', monospace; font-size: 0.76rem; color: var(--ink-dim);
    border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 12px 16px;
    max-height: 180px; overflow-y: auto; background: var(--panel); }
  .log .entry { padding: 3px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; }
  .log .entry:last-child { border-bottom: none; }
  .log .ts { color: var(--ink); flex-shrink: 0; }
  .state-msg { font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; color: var(--ink-dim);
    padding: 20px 4px; line-height: 1.7; }
  .state-msg .file { color: var(--ink); }
  .state-msg code { background: var(--bg); border: 1px solid var(--line); border-radius: 2px;
    padding: 1px 5px; }
  footer.note { margin-top: 28px; font-size: 0.72rem; color: var(--ink-dim);
    font-family: 'IBM Plex Mono', monospace; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>HuB — the work board</h1>
      <div class="sub" id="subline">loading…</div>
    </div>
    <div class="btns">
      <button class="btn" id="refreshBtn" type="button">refresh</button>
      <button class="btn" id="themeToggle" type="button">toggle theme</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="panel-line"></div>
  <div id="body"></div>

  <footer class="note" id="footNote"></footer>
</div>

<script>
const CONFIG_URL = './config.json';
const BOARD_NAME = 'work_board.json';
let CONFIG = null;
let BOARD = null;              // the current-state document, or null
let BOARD_ERR = null;
let REPO_STATE = {};           // name -> { status, entries, detail }
let current = null;

function rawUrl(r, file) {
  return `https://raw.githubusercontent.com/${r.owner}/${r.repo}/${r.branch}/${file}`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function parseJSONL(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    try { return JSON.parse(l); } catch (e) { return null; }
  }).filter(Boolean).sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
}

// A value the sweep did not measure renders as an em dash, never as 0.
// See PM_STATUS_FRAMEWORK.md and the "absent field is a true statement" rule.
function em(v) { return (v === undefined || v === null) ? '—' : v; }

// The board keys repos by their GitHub repo name (lowercase, e.g. "ephapse"),
// while config.json uses display names ("Ephapse"). Match on either, case
// insensitively, so a row for a board repo resolves to its config entry and
// therefore to a real GitHub URL.
function repoByName(name) {
  if (!CONFIG || !name) return null;
  const k = String(name).toLowerCase();
  return CONFIG.repos.find(r => r.name.toLowerCase() === k || r.repo.toLowerCase() === k) || null;
}

function issueUrl(repoName, number) {
  const r = repoByName(repoName);
  return r ? `https://github.com/${r.owner}/${r.repo}/issues/${number}` : null;
}

function issueLink(repoName, number) {
  const url = issueUrl(repoName, number);
  const label = `${esc(repoName)} #${esc(number)}`;
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${label}</a>` : label;
}

// A filtered issue-list link, so every count is drillable to the records.
function issueListUrl(repoName, label) {
  const r = repoByName(repoName);
  if (!r) return null;
  return `https://github.com/${r.owner}/${r.repo}/issues`
    + `?q=is%3Aissue+is%3Aopen+label%3A%22${encodeURIComponent(label)}%22`;
}

// The claim files themselves — the records behind a claim count. A claim file
// is named after its issue, so this is one step from the number to the lock.
function claimsDirUrl(repoName) {
  const r = repoByName(repoName);
  if (!r) return null;
  return `https://github.com/${r.owner}/${r.repo}/tree/${r.branch}/claims`;
}

// A repo's open issues — where its run comments live. A run is scraped from an
// issue comment, so this is the record set behind a per-repo run count.
function repoIssuesUrl(repoName) {
  const r = repoByName(repoName);
  if (!r) return null;
  return `https://github.com/${r.owner}/${r.repo}/issues?q=is%3Aissue+is%3Aopen`;
}

// A filtered issue-list link matching ANY of several labels (GitHub ORs a
// comma-separated label: list). Used where a count is defined as a union, e.g.
// "awaiting review" = needs-review plus any review:* label.
function issueListUrlAny(repoName, labels) {
  const r = repoByName(repoName);
  if (!r || !labels || !labels.length) return null;
  const q = labels.map(l => `%22${encodeURIComponent(l)}%22`).join('%2C');
  return `https://github.com/${r.owner}/${r.repo}/issues?q=is%3Aissue+is%3Aopen+label%3A${q}`;
}

// Closed in the last N days — the records behind a "closed (Nd)" count.
function closedIssuesUrl(repoName, days) {
  const r = repoByName(repoName);
  if (!r) return null;
  const since = new Date(Date.now() - days * 864e5).toISOString().slice(0, 10);
  return `https://github.com/${r.owner}/${r.repo}/issues`
    + `?q=is%3Aissue+is%3Aclosed+closed%3A%3E%3D${since}`;
}

// A number, linked to its records when the value is measured and the target is
// known. An em dash is unmeasured, so it is never a link.
function statLink(val, href, text) {
  const label = `${esc(val)}${text ? ' ' + esc(text) : ''}`;
  return href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${label}</a>` : label;
}

function relTime(iso) {
  if (!iso) return '—';
  const t = new Date(iso).getTime();
  if (Number.isNaN(t)) return '—';
  const mins = Math.round((Date.now() - t) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 48) return `${hrs} h ago`;
  return `${Math.round(hrs / 24)} d ago`;
}

function hoursSince(iso) {
  if (!iso) return null;
  const t = new Date(iso).getTime();
  if (Number.isNaN(t)) return null;
  return (Date.now() - t) / 3600000;
}

function fmtMinutes(m) {
  if (m === undefined || m === null) return '—';
  if (m < 60) return `${Math.round(m)}m`;
  const h = Math.floor(m / 60), r = Math.round(m % 60);
  return r ? `${h}h ${r}m` : `${h}h`;
}

async function loadRepo(r) {
  REPO_STATE[r.name] = { status: 'loading', entries: [] };
  try {
    const res = await fetch(rawUrl(r, 'status_log.jsonl'), { cache: 'no-store' });
    if (!res.ok) {
      REPO_STATE[r.name] = { status: res.status === 404 ? 'empty' : 'error', entries: [], detail: `HTTP ${res.status}` };
      return;
    }
    const entries = parseJSONL(await res.text());
    REPO_STATE[r.name] = entries.length ? { status: 'ok', entries } : { status: 'empty', entries: [] };
  } catch (e) {
    REPO_STATE[r.name] = { status: 'error', entries: [], detail: String(e) };
  }
}

// The board lives beside the automation log, in this repo. A tab whose repo
// has no board shows the tab-local view instead, so nothing is fabricated.
async function loadBoard() {
  const self = CONFIG.repos.find(r => r.name === 'Automation') || CONFIG.repos[0];
  try {
    const res = await fetch(rawUrl(self, BOARD_NAME), { cache: 'no-store' });
    if (!res.ok) { BOARD_ERR = `HTTP ${res.status}`; return; }
    BOARD = await res.json();
    BOARD_ERR = null;
  } catch (e) {
    BOARD_ERR = String(e);
  }
}

async function loadAll() {
  document.getElementById('subline').textContent = 'loading config…';
  let cfgRes;
  try {
    cfgRes = await fetch(CONFIG_URL, { cache: 'no-store' });
  } catch (e) {
    showConfigError(`config.json could not be fetched (${String(e)}).`);
    return;
  }
  if (!cfgRes.ok) { showConfigError(`config.json returned HTTP ${cfgRes.status}.`); return; }
  try {
    CONFIG = await cfgRes.json();
  } catch (e) {
    showConfigError('config.json is not valid JSON.');
    return;
  }
  if (!CONFIG || !Array.isArray(CONFIG.repos) || !CONFIG.repos.length) {
    showConfigError('config.json has no "repos" array.');
    return;
  }

  buildTabs();
  document.getElementById('subline').textContent = 'fetching…';
  await Promise.all(CONFIG.repos.map(loadRepo));
  await loadBoard();
  if (!current) current = CONFIG.repos[0].name;
  updateTabDots();
  renderCurrent();
  document.getElementById('subline').textContent =
    `${CONFIG.repos.length} repo(s) tracked — last fetched ${new Date().toLocaleTimeString()}`;
}

function showConfigError(detail) {
  document.getElementById('subline').textContent = 'config error';
  document.getElementById('tabs').innerHTML = '';
  document.getElementById('footNote').textContent = '';
  document.getElementById('body').innerHTML = `<div class="card"><div class="state-msg">
    Couldn't load <code>config.json</code>: ${esc(detail)}<br><br>
    Confirm <code>config.json</code> is at the repo root and is valid JSON.
  </div></div>`;
}

function buildTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  CONFIG.repos.forEach((r, i) => {
    const b = document.createElement('button');
    b.setAttribute('role', 'tab');
    b.dataset.name = r.name;
    b.innerHTML = `<span class="dot"></span>${esc(r.name)} <span style="color:var(--ink-dim); font-size:0.7em;">(${esc(r.branch)})</span>`;
    if (i === 0) { b.classList.add('active'); current = r.name; }
    b.addEventListener('click', () => {
      current = r.name;
      [...tabsEl.children].forEach(c => c.classList.toggle('active', c === b));
      renderCurrent();
    });
    tabsEl.appendChild(b);
  });
}

function updateTabDots() {
  [...document.querySelectorAll('#tabs button')].forEach(b => {
    const st = REPO_STATE[b.dataset.name]?.status;
    const dot = b.querySelector('.dot');
    dot.className = 'dot' + (st === 'ok' ? ' ok' : st === 'empty' ? ' warn' : st === 'error' ? ' err' : '');
  });
}

function renderEmptyState(name, state) {
  const body = document.getElementById('body');
  const repo = repoByName(name) || {};
  if (state.status === 'loading') {
    body.innerHTML = `<div class="card"><div class="state-msg">
      Fetching <code>status_log.jsonl</code> for <span class="file">${esc(name)}</span>…
    </div></div>`;
  } else if (state.status === 'empty') {
    body.innerHTML = `<div class="card"><div class="state-msg">
      No <code>status_log.jsonl</code> found yet for <span class="file">${esc(name)}</span> on branch
      <code>${esc(repo.branch)}</code>.<br><br>
      This repo hasn't wired up the sweep extension yet — see <code>PM_STATUS_FRAMEWORK.md</code>
      in this repo for the record schema.
    </div></div>`;
  } else {
    body.innerHTML = `<div class="card"><div class="state-msg">
      Couldn't fetch status data for <span class="file">${esc(name)}</span> (${esc(state.detail || 'unknown error')}).<br><br>
      Check that the repo is public, that <code>${esc(repo.owner)}/${esc(repo.repo)}</code> is correct,
      the branch name in <code>config.json</code> is correct, and that
      <code>status_log.jsonl</code> exists at the repo root on that branch.
    </div></div>`;
  }
}

function renderCurrent() {
  const repo = repoByName(current);
  if (repo) {
    document.getElementById('footNote').textContent =
      `Source: https://raw.githubusercontent.com/${repo.owner}/${repo.repo}/${repo.branch}/status_log.jsonl`;
  }
  const state = REPO_STATE[current];
  if (current === 'Automation') { renderBoard(); return; }
  if (!state || state.status !== 'ok') {
    renderEmptyState(current, state || { status: 'loading' });
    return;
  }
  renderRepoCard(current, state.entries);
}

/* ---------------------------------------------------------------- board --- */

function renderBoard() {
  const body = document.getElementById('body');
  if (!BOARD) {
    body.innerHTML = `<div class="card"><div class="state-msg">
      The work board (<code>${esc(BOARD_NAME)}</code>) could not be read${BOARD_ERR ? ` (${esc(BOARD_ERR)})` : ''}.<br><br>
      It is written by this repo's own <code>automation_sweep.py</code> on a schedule. Until the
      next successful sweep, this tab shows nothing rather than a stale or invented view.
    </div></div>`;
    return;
  }
  const board = BOARD;
  const latest = latestAutomation();
  const queue = board.queue || {};
  const needs = board.needs_you || [];
  const claims = board.claims || {};

  body.innerHTML = `
    <div class="card">
      <h2>Is the machine running? <span class="q">— as of ${esc(relTime(board.generated))}</span></h2>
      <div class="strip" id="strip"></div>
    </div>

    <div class="card">
      <h2>Is work getting done? <span class="q">— runs per day, last 30 days</span></h2>
      <svg class="chart" id="runsChart" viewBox="0 0 1000 220" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="legend" id="runsLegend"></div>
    </div>

    <div class="card">
      <h2>Recent runs <span class="q">— every row opens its issue</span></h2>
      <div id="recentRuns"></div>
    </div>

    <div class="card">
      <h2>What's open? <span class="q">— counts, each linking to its issue list</span></h2>
      <div id="queueTable"></div>
    </div>

    <div class="card">
      <h2>Needs you <span class="q">— blocked-needs-input and needs:human, oldest first</span></h2>
      <div id="needsYou"></div>
    </div>

    <div class="card">
      <h2>Snapshot log <span class="q">— appended history of the automation summary</span></h2>
      <div class="log" id="logList"></div>
    </div>
  `;

  renderStrip(board, latest, claims);
  renderRunsChart(board);
  renderRecentRuns(board);
  renderQueueTable(queue);
  renderNeedsYou(needs);
  renderLog(boardLog());
}

function latestAutomation() {
  const st = REPO_STATE['Automation'];
  if (!st || st.status !== 'ok' || !st.entries.length) return null;
  return st.entries[st.entries.length - 1].automation || null;
}

function boardLog() {
  const st = REPO_STATE['Automation'];
  if (!st || st.status !== 'ok') return [];
  return st.entries.slice().reverse().filter(e => e.notes).slice(0, 12)
    .map(e => ({ ts: e.timestamp, note: e.notes }));
}

function renderStrip(board, latest, claims) {
  const runs24 = latest ? latest.runs_24h : undefined;
  const staleN = (claims.stale || []).length;
  const claimsTotal = claims.total;
  const ageH = hoursSince(board.generated);
  const staleSweep = ageH !== null && ageH > 6;
  const selfRepo = repoByName('Automation') || repoByName(board.repos?.[0]) || null;

  // Every number here drills into its records, per the "no orphan numbers"
  // rule: a count with no way to ask "why" does not ship. A claim count is the
  // number of claim FILES, so it links to the claims/ directory — the label
  // lists can disagree with the files (a repo may hold a lock without the
  // label), and a claim-file count must not be verified against a label.
  const claimRepoLinks = (repos, withCount) => repos.sort()
    .map(r => {
      const url = claimsDirUrl(r);
      const text = `${esc(r)}${withCount ? ' ' + esc(claims.held[r]) : ''}`;
      return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>` : text;
    }).join(' · ');
  const heldList = claimRepoLinks(Object.keys(claims.held || {}), true);

  // The per-repo 24h breakdown links each repo to its open issues — where its
  // run comments live. Runs are not directly listable, but the comments that
  // record them are, so the number is not a dead end.
  const breakdown = Object.keys(board.runs_24h_by_repo || {}).sort()
    .map(r => {
      const url = repoIssuesUrl(r);
      const n = board.runs_24h_by_repo[r];
      return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(r)} ${esc(n)}</a>`
                 : `${esc(r)} ${esc(n)}`;
    }).join(' · ');
  const staleList = (claims.stale || []).map(s => {
    const m = /^(.+?) #(\d+)$/.exec(s);
    return m ? issueLink(m[1], m[2]) : esc(s);
  }).join(' · ');

  const logHref = selfRepo
    ? esc(rawUrl(selfRepo, 'status_log.jsonl'))
    : null;

  // A zero is still a claim about the records, so the stale-claims stat links
  // to the claim files even when there is nothing stale to show: that is how
  // the reader verifies the zero rather than taking it on faith. When no repo
  // has a claims/ mechanism the number is an em dash and the stat is not a
  // link — there is nothing to drill into.
  const staleLinks = claimRepoLinks(Object.keys(claims.held || {}), false);
  const heldRepos = Object.keys(claims.held || {}).sort();
  // Both claim counts are read from the claim files, so both drill to the
  // claims/ directory. The individual issues are linked in the mini line; a
  // count of N must not point at a single issue, which would be its own orphan.
  const claimsDrill = heldRepos.length ? claimsDirUrl(heldRepos[0]) : null;

  const items = [
    { lbl: 'Last sweep', val: esc(relTime(board.generated)),
      href: logHref, title: 'the appended log this summary came from',
      cls: staleSweep ? 'crit' : '',
      mini: staleSweep ? 'stale — expected within 6h' : 'fresh' },
    { lbl: 'Runs (24h)', val: em(runs24), href: '#recentRuns',
      title: 'the recent-runs table below', cls: '',
      // A run that touched several repos is one run in the total (deduped by
      // id) but appears under each repo here, so the parts can sum above the
      // whole. Say so in the visible text, not only a tooltip: an unexplained
      // 40 next to parts summing to 44 reads as an arithmetic error.
      mini: breakdown ? `${breakdown} · some runs span more than one repo` : '—',
      miniTitle: 'runs by repo; a run that touched several repos appears under each, '
               + 'so these can sum above the total' },
    { lbl: 'Claims held now', val: claimsTotal === undefined ? '—' : esc(claimsTotal),
      href: claimsDrill, title: 'the claim files behind this count',
      cls: '', mini: heldList || 'no claim-file mechanism' },
    { lbl: 'Stale claims', val: claimsTotal === undefined ? '—' : esc(staleN),
      cls: staleN > 0 ? 'warn' : '',
      href: claimsDrill, title: 'the claim files this count was read from',
      mini: staleN ? staleList : (staleLinks || 'no claim-file mechanism') },
  ];
  document.getElementById('strip').innerHTML = items.map(i => {
    const num = i.href
      ? `<a href="${i.href}"${i.href.startsWith('#') ? '' : ' target="_blank" rel="noopener"'}${i.title ? ` title="${esc(i.title)}"` : ''}>${i.val}</a>`
      : i.val;
    const mini = i.miniTitle
      ? `<span class="mini" title="${esc(i.miniTitle)}">${i.mini}</span>`
      : `<span class="mini">${i.mini}</span>`;
    return `<div class="stat"><div class="num ${i.cls}">${num}</div>
      <div class="lbl">${i.lbl}${mini}</div></div>`;
  }).join('');
}

// A stacked bar per day: one segment per repo. The x-axis is the last 30 days,
// so a gap in work shows as a short bar, not as a missing point.
function renderRunsChart(board) {
  const svg = document.getElementById('runsChart');
  const byDay = board.runs_by_day || {};
  const repos = Object.keys(byDay).sort();
  const days = repos.length ? Object.keys(byDay[repos[0]]) : [];
  const W = 1000, H = 220, padL = 34, padR = 16, padT = 14, padB = 30;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const totals = days.map(d => repos.reduce((a, r) => a + (byDay[r][d] || 0), 0));
  const maxN = Math.max(1, ...totals);
  const bw = days.length ? innerW / days.length : innerW;

  const colors = ['var(--blue)', 'var(--teal)', 'var(--amber)', 'var(--rose)', '#8A7BD8'];
  const colorFor = r => colors[repos.indexOf(r) % colors.length];

  let bars = '';
  days.forEach((d, i) => {
    let y = padT + innerH;
    repos.forEach(r => {
      const n = byDay[r][d] || 0;
      if (!n) return;
      const h = (n / maxN) * innerH;
      y -= h;
      bars += `<rect x="${(padL + i * bw + 1).toFixed(1)}" y="${y.toFixed(1)}"`
        + ` width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" fill="${colorFor(r)}">`
        + `<title>${esc(r)} ${esc(d)}: ${esc(n)} run(s)</title></rect>`;
    });
  });

  const axis = [0, maxN].map(v =>
    `<text x="${padL - 6}" y="${(padT + innerH - (v / maxN) * innerH + 4).toFixed(1)}"`
    + ` font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-dim)"`
    + ` text-anchor="end">${v}</text>`).join('');

  // Label roughly weekly so dense logs cannot overprint the axis. Always label
  // the last day, but only if it clears the previous tick: at 30 days the weekly
  // ticks land ~31.7px apart, and a forced final tick would sit on top of the
  // one before it (two ~30px labels in a 31.7px gap).
  const tickIdx = days.map((d, i) => i).filter(i => i % 7 === 0);
  const lastIdx = days.length - 1;
  if (lastIdx >= 0 && (tickIdx.length === 0 || (lastIdx - tickIdx[tickIdx.length - 1]) * bw >= 34)) {
    tickIdx.push(lastIdx);
  }
  const ticks = tickIdx.map(i =>
    `<text x="${(padL + i * bw + bw / 2).toFixed(1)}" y="${H - 8}"`
    + ` font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-dim)"`
    + ` text-anchor="middle">${esc(days[i].slice(5))}</text>`).join('');

  svg.innerHTML = `
    <line x1="${padL}" y1="${padT}" x2="${W - padR}" y2="${padT}" stroke="var(--line)" />
    <line x1="${padL}" y1="${padT + innerH}" x2="${W - padR}" y2="${padT + innerH}" stroke="var(--line)" />
    ${axis}${bars}${ticks}`;

  const noData = !days.length || totals.every(t => t === 0);
  document.getElementById('runsLegend').innerHTML = noData
    ? `<div class="item">No runs recorded in the last 30 days.</div>`
    : repos.map(r => `<div class="item"><span class="swatch" style="background:${colorFor(r)}"></span>${esc(r)}</div>`).join('');
}

function renderRecentRuns(board) {
  const runs = (board.recent_runs || []).slice(0, 15);
  const el = document.getElementById('recentRuns');
  if (!runs.length) {
    el.innerHTML = `<div class="state-msg">No runs recorded. A run leaves a public trace only
      when an agent claims an issue, so an empty list means no work was claimed — not that the
      scheduler is broken.</div>`;
    return;
  }
  // The heading promises "every row opens its issue", so the whole row is
  // clickable, not just the Issue cell. The cell keeps its anchor for keyboard
  // and middle-click; the row handler is mouse-only enhancement on top.
  el.innerHTML = `<div class="tablewrap"><table><thead><tr>
      <th>Run</th><th>Repo</th><th>Issue</th><th>Started</th><th>Duration</th><th>Outcome</th>
    </tr></thead><tbody>` + runs.map(r => {
    const outcome = r.outcome === 'done'
      ? '<span class="pill done">done</span>'
      : '<span class="pill open">no done comment</span>';
    const href = r.issue ? issueUrl(r.repo, r.issue) : null;
    return `<tr${href ? ` class="rowlink" data-href="${esc(href)}"` : ''}>
      <td>${esc(r.run_id)}</td>
      <td>${esc(r.repo)}</td>
      <td>${r.issue ? issueLink(r.repo, r.issue) : '—'}</td>
      <td>${esc(relTime(r.start))}</td>
      <td>${esc(fmtMinutes(r.minutes))}</td>
      <td>${outcome}</td>
    </tr>`;
  }).join('') + `</tbody></table></div>`;
}

// One delegated listener for every clickable row, so the markup above stays a
// plain string and re-rendering cannot leak handlers.
document.addEventListener('click', ev => {
  const row = ev.target.closest && ev.target.closest('tr.rowlink');
  if (!row || ev.target.closest('a')) return;
  const href = row.getAttribute('data-href');
  if (href) window.open(href, '_blank', 'noopener');
});

function renderQueueTable(queue) {
  const el = document.getElementById('queueTable');
  const repos = Object.keys(queue).sort();
  if (!repos.length) {
    el.innerHTML = `<div class="state-msg">No queue data. The sweep could not read any repo's issues.</div>`;
    return;
  }
  const cell = (repo, n, label) => {
    const url = issueListUrl(repo, label);
    return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(n)}</a>` : esc(n);
  };
  el.innerHTML = `<div class="tablewrap"><table><thead><tr>
      <th>Repo</th><th>Available</th><th>Claimed</th><th>Blocked (needs input)</th><th>On hold (audit)</th>
    </tr></thead><tbody>` + repos.map(repo => {
    const q = queue[repo];
    return `<tr>
      <td>${esc(repo)}</td>
      <td>${cell(repo, q.available, 'status:available')}</td>
      <td>${cell(repo, q.claimed, 'status:claimed')}</td>
      <td>${cell(repo, q.blocked_needs_input, 'status:blocked-needs-input')}</td>
      <td>${cell(repo, q.on_hold, 'on-hold')}</td>
    </tr>`;
  }).join('') + `</tbody></table></div>
  <div class="legend"><div class="item">Counts link to the filtered GitHub issue list. On hold is
    the auditor's promotion queue — the human gate — and is not a "needs input" item.</div></div>`;
}

function renderNeedsYou(needs) {
  const el = document.getElementById('needsYou');
  if (!needs.length) {
    el.innerHTML = `<div class="state-msg">Nothing is waiting on you.</div>`;
    return;
  }
  el.innerHTML = `<div class="tablewrap"><table><thead><tr>
      <th>Opened</th><th>Issue</th><th>Title</th><th>Labels</th>
    </tr></thead><tbody>` + needs.map(e => {
    const labels = (e.labels || []).map(l => `<span class="pill">${esc(l)}</span>`).join(' ');
    return `<tr>
      <td>${esc(e.opened || '—')}</td>
      <td>${issueLink(e.repo, e.number)}</td>
      <td>${esc(e.title || '')}</td>
      <td>${labels}</td>
    </tr>`;
  }).join('') + `</tbody></table></div>`;
}

function renderLog(entries) {
  const el = document.getElementById('logList');
  if (!el) return;
  el.innerHTML = entries.length
    ? entries.map(e => `<div class="entry"><span class="ts">${esc(e.ts)}</span><span>${esc(e.note)}</span></div>`).join('')
    : '<div class="state-msg">No notes logged yet.</div>';
}

/* ----------------------------------------------------------- repo cards --- */

// A source repo's tab keeps its own log view. It leads with the same queue
// question the board answers, read from that repo's latest snapshot, so a
// number there is never orphaned either.
function renderRepoCard(name, entries) {
  const latest = entries[entries.length - 1];
  const repo = repoByName(name) || {};
  const flow = latest.flow || {};
  // The board keys repos by GitHub repo name; match it to this tab's entry.
  const boardRepo = repo ? Object.keys(BOARD?.queue || {})
    .find(k => k.toLowerCase() === repo.repo.toLowerCase()) : null;
  const boardQ = (boardRepo && BOARD.queue[boardRepo]) || null;
  const log = entries.slice().reverse().filter(e => e.notes).slice(0, 12)
    .map(e => ({ ts: e.timestamp, note: e.notes }));

  const items = [
    { lbl: 'Open', val: em(flow.open_total), href: repoIssuesUrl(name),
      title: 'this repo\'s open issues' },
    { lbl: 'Available', val: em(flow.available),
      href: issueListUrl(name, 'status:available'), title: 'issues labelled status:available' },
    { lbl: 'Claimed (label)', val: em(flow.wip),
      href: issueListUrl(name, 'status:claimed'),
      title: 'issues carrying the status:claimed label — the claim files are the real lock' },
    { lbl: 'Blocked (needs input)', val: em(flow.blocked), cls: flow.blocked > 0 ? 'warn' : '',
      href: issueListUrl(name, 'status:blocked-needs-input'),
      title: 'issues labelled status:blocked-needs-input' },
    { lbl: 'Awaiting review', val: em(flow.needs_review),
      href: issueListUrlAny(name, ['needs-review', 'review:pending', 'review:confirmed', 'review:flagged']),
      title: 'needs-review or any review:* label' },
    { lbl: 'Closed (30d)', val: em(flow.closed_last_30d), href: closedIssuesUrl(name, 30),
      title: 'issues closed in the last 30 days' },
  ];

  // Where the board knows the same repo, prefer its live queue counts and say
  // so, since the label count and the claim-file count disagree by design. Each
  // count links to its own records — the claim count to the claims/ files.
  const boardLine = boardQ
    ? `<div class="legend"><div class="item">Live queue from the work board:
        ${statLink(boardQ.available, issueListUrl(name, 'status:available'), 'available')} ·
        ${statLink(boardQ.claimed, issueListUrl(name, 'status:claimed'), 'claimed')} ·
        ${statLink(boardQ.blocked_needs_input, issueListUrl(name, 'status:blocked-needs-input'), 'blocked-needs-input')} ·
        ${statLink(boardQ.on_hold, issueListUrl(name, 'on-hold'), 'on hold')}</div></div>`
    : '';

  document.getElementById('body').innerHTML = `
    <div class="card">
      <h2>${esc(name)} — latest sweep <span class="q">— ${esc(repo.repo)}@${esc(repo.branch)}</span></h2>
      <div class="strip" id="strip"></div>
      ${boardLine}
    </div>
    <div class="card">
      <h2>Repo</h2>
      <div class="legend">
        <div class="item"><a href="https://github.com/${esc(repo.owner)}/${esc(repo.repo)}" target="_blank" rel="noopener">repository</a></div>
        <div class="item"><a href="https://github.com/${esc(repo.owner)}/${esc(repo.repo)}#readme" target="_blank" rel="noopener">README</a></div>
        <div class="item"><a href="${esc(issueListUrl(name, 'status:available'))}" target="_blank" rel="noopener">available issues</a></div>
        <div class="item"><a href="${esc(issueListUrl(name, 'status:blocked-needs-input'))}" target="_blank" rel="noopener">blocked issues</a></div>
      </div>
    </div>
    <div class="card">
      <h2>Snapshot log <span class="q">— newest first</span></h2>
      <div class="log" id="logList"></div>
    </div>
  `;
  document.getElementById('strip').innerHTML = items.map(i => {
    const measured = i.val !== '—';
    const num = measured && i.href
      ? `<a href="${esc(i.href)}" target="_blank" rel="noopener"${i.title ? ` title="${esc(i.title)}"` : ''}>${i.val}</a>`
      : i.val;
    return `<div class="stat"><div class="num ${i.cls || ''}">${num}</div>
      <div class="lbl">${i.lbl}</div></div>`;
  }).join('');
  renderLog(log);
}

try { const saved = localStorage.getItem('hub-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('hub-theme', next); } catch (e) {}
});
document.getElementById('refreshBtn').addEventListener('click', loadAll);

loadAll();
